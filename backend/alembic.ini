# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate new migration files
# file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file
# timezone = UTC

# max length of characters to use when creating a unique identifier
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow Alembic to purge
# unnamed constraints when generating schemas
# sourceless = false

# version_locations = %(here)s/bar:%(here)s/bat:migrations/versions

# version_path_separator = :

# sqlalchemy.url is intentionally left unset here.
# The actual DATABASE_URL is injected at runtime via migrations/env.py
# which reads settings.DATABASE_URL from the environment.
# Do NOT hardcode a URL here — it will be ignored by env.py anyway,
# and having it set creates confusion.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
