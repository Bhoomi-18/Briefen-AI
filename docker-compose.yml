version: '3.8'

# =============================================================================
# Briefen — Local Development Docker Compose
# FOR LOCAL DEVELOPMENT ONLY — not used in production.
#
# Production services:
#   PostgreSQL -> Neon (https://neon.tech)
#   Redis      -> Upstash (https://upstash.com)
#   Qdrant     -> Qdrant Cloud (https://cloud.qdrant.io)
#
# Copy docker.env.example to docker.env and fill in credentials before running.
# =============================================================================

services:
  # 1. PostgreSQL Relational Database (local dev only)
  postgres:
    image: postgres:16-alpine
    container_name: briefen-postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-briefen_db}
    networks:
      - briefen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker (local dev only)
  redis:
    image: redis:7-alpine
    container_name: briefen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - briefen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Qdrant Vector Database (local dev only)
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: briefen-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - briefen-network
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. FastAPI Backend REST API & WebSocket Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: briefen-backend
    ports:
      - "8000:8000"
    env_file:
      - docker.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - briefen-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Celery Asynchronous Worker (uses dedicated worker Dockerfile)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: briefen-celery-worker
    env_file:
      - docker.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - briefen-network

  # 6. Next.js Frontend Client Server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # These are passed as build-time ARGs for browser-side env vars.
        # For production (Vercel), set these directly in the Vercel dashboard.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        - NEXT_PUBLIC_SKIP_EMAIL_VERIFICATION=${NEXT_PUBLIC_SKIP_EMAIL_VERIFICATION:-true}
    container_name: briefen-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - briefen-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
    name: briefen-pg-data
  redis-data:
    name: briefen-redis-data
  qdrant-data:
    name: briefen-qdrant-data

networks:
  briefen-network:
    name: briefen-network
    driver: bridge
